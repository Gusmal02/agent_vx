[supervisord]
nodaemon=false
logfile=/home/user/agent_vx/logs/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/home/user/agent_vx/logs

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:riemann_sonnet]
command=uv run python run_v020.py --problem riemann --n-agents 15 --rounds 5 --max-hours 8 --researcher --meta-monitor --oracle-model sonnet
directory=/home/user/agent_vx
autostart=true
autorestart=true
startsecs=10
startretries=999
stdout_logfile=/home/user/agent_vx/logs/riemann_sonnet_sv.log
stderr_logfile=/home/user/agent_vx/logs/riemann_sonnet_sv.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3

[program:riemann_opus]
command=uv run python run_v020.py --problem riemann --n-agents 5 --rounds 5 --max-hours 8 --researcher --oracle-model opus
directory=/home/user/agent_vx
autostart=true
autorestart=true
startsecs=10
startretries=999
stdout_logfile=/home/user/agent_vx/logs/riemann_opus_sv.log
stderr_logfile=/home/user/agent_vx/logs/riemann_opus_sv.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
