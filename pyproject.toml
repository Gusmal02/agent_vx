[project]
name = "agente-vx"
version = "0.0.8"
requires-python = ">=3.14"
dependencies = [
    "torch>=2.0",
    "numpy>=1.26",
    "gymnasium>=0.29",
    "sympy>=1.13",
    "matplotlib>=3.9",
    "scipy>=1.13",
    "networkx>=3.3",
    "mpmath>=1.3.0",
    "anthropic>=1.11.0",
    "python-dotenv>=1.2.4",
]

[tool.uv]
python-preference = "managed"

[project.scripts]
agente-v008 = "run_v008:main"
